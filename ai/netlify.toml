# ai.renewablox.com — RenewaBlox's AI tools (build.py beside this file).
# A Netlify project of its own (renewablox-ai) whose base directory is ai/, so this file, not the
# energy site's netlify.toml at the root of the repository, configures it. Netlify builds on a push
# to its production branch that changes one of the site's inputs (ai/inputs.txt: this folder and the
# Atlas brand files the build copies from atlas/root/; the build fails if it reads a file the list
# doesn't cover). Every build and deploy costs credits, so the ignore command skips the rest
# (tools/netlify-ignore.sh).

[build]
  command = "python3 build.py"
  publish = "site"
  ignore = "bash ../tools/netlify-ignore.sh ai/inputs.txt"

[build.environment]
  PYTHON_VERSION = "3.12"

# ---- Atlas ----
# Atlas is its own Netlify project (renewablox-atlas, atlas.renewablox.com) and keeps deploying as it
# does. Whether it joins this site isn't decided, so nothing here links to it, but /atlas/ still answers
# by proxy. Its pages were published at the root of their own domain, so a link of theirs that starts
# with / is sent back under /atlas/.
[[redirects]]
  from = "/atlas"
  to = "/atlas/"
  status = 301
  force = true

[[redirects]]
  from = "/atlas/*"
  to = "https://atlas.renewablox.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/investors/*"
  to = "/atlas/investors/:splat"
  status = 301

[[redirects]]
  from = "/market/*"
  to = "/atlas/market/:splat"
  status = 301

[[redirects]]
  from = "/portal/*"
  to = "/atlas/portal/:splat"
  status = 301

# ---- headers ----
# OSCAR is the team's own file, served as it is: inline code, its Google font (Space Grotesk), and the
# three live sources it calls directly, then through the public proxies it falls back on. build.py checks
# this policy allows every origin the page reaches, and no other.
[[headers]]
  for = "/oscar/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; connect-src https://api.coingecko.com https://mempool.space https://api.blockchain.info https://api.allorigins.win https://cors.isomorphic-git.org https://api.codetabs.com; base-uri 'none'; form-action 'none'; frame-ancestors 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex"

# The home page: inline code, and the brand's stylesheet, fonts and images from this site. A rule for a
# folder does not cover its index.html, which Netlify serves too, so the page has a rule for each.
[[headers]]
  for = "/"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/index.html"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Robots-Tag = "noindex"
