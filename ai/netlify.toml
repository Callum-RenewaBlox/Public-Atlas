# ai.renewablox.com — RenewaBlox's AI tools (build.py beside this file).
# A Netlify project of its own (renewablox-ai) whose base directory is ai/, so this file, not the
# energy site's netlify.toml at the root of the repository, configures it. Netlify builds on every
# push to main (the build is a copy and three checks, so it takes seconds).

[build]
  command = "python3 build.py"
  publish = "site"

[build.environment]
  PYTHON_VERSION = "3.12"

# ---- OSCAR's live market inputs ----
# The page asks each source directly first; these same-origin rewrites are its fallback when a
# browser or network refuses the direct call. build.py checks they match the sources the page uses.
# They sit under /oscar, so only a signed-in browser can use them.
[[redirects]]
  from = "/oscar/api/coingecko/*"
  to = "https://api.coingecko.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/oscar/api/mempool/*"
  to = "https://mempool.space/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/oscar/api/blockchain/*"
  to = "https://api.blockchain.info/:splat"
  status = 200
  force = true

# ---- Atlas ----
# Atlas is its own Netlify project (renewablox-atlas, atlas.renewablox.com) and keeps deploying as it
# does; this site serves it under /atlas/ by proxy. Its pages were published at the root of their own
# domain, so a link of theirs that starts with / is sent back under /atlas/.
[[redirects]]
  from = "/atlas"
  to = "/atlas/"
  status = 301
  force = true

[[redirects]]
  from = "/atlas/*"
  to = "https://atlas.renewablox.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/investors/*"
  to = "/atlas/investors/:splat"
  status = 301

[[redirects]]
  from = "/market/*"
  to = "/atlas/market/:splat"
  status = 301

[[redirects]]
  from = "/portal/*"
  to = "/atlas/portal/:splat"
  status = 301

# ---- OSCAR's team sign-in ----
# Everything under /oscar passes through netlify/edge-functions/oscar-auth.js (its path is declared
# in the function), which sends anyone without a session to Google and serves OSCAR only to the
# accounts in OSCAR_ALLOWED_EMAILS / OSCAR_ALLOWED_DOMAINS. Header rules here don't reach responses
# an edge function makes, so OSCAR's headers are set in that function.

# ---- headers ----
# Every page here is self-contained, so the policy allows inline code and data images only.
[[headers]]
  for = "/"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Robots-Tag = "noindex"
