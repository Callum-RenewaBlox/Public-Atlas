<head>
<meta charset="utf-8">
<!-- ai.renewablox.com 404 (ai/build.py writes it to /404.html; Netlify serves it at any unknown address, so every
     URL here is root-absolute). It is the Atlas's 404 in the Atlas's own classes. An unknown address under /oscar/
     gets OSCAR's policy, which refuses this site's own files, so the page is whole on its inline rules and a data:
     wordmark, and the script below adds the icon and atlas.css (for the brand font) everywhere else. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found &middot; RenewaBlox AI</title>
<script>
  if (location.pathname.indexOf('/oscar/') !== 0) {
    [['icon', '/favicon.ico'], ['stylesheet', '/assets/atlas.css']].forEach(function (l) {
      var e = document.createElement('link'); e.rel = l[0]; e.href = l[1]; document.head.appendChild(e);
    });
  }
</script>
<style>
  body { margin: 0; background: #0e2631; font: 400 15px/1.5 'Telegraf', system-ui, -apple-system, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
  .guard { min-height: 100vh; min-height: 100dvh; box-sizing: border-box; display: grid; place-items: center; padding: 24px; background: #0e2631; color: #9fb0b8; text-align: center; }
  .guard img { display: block; height: 20px; width: auto; margin: 0 auto; }
  .guard h1 { margin: 14px 0 10px; color: #fff; font-weight: 700; font-size: 30px; line-height: 1.2; }
  .guard p { max-width: 46ch; margin: 0 auto 22px; line-height: 1.6; text-wrap: balance; }
  .guard__cta { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .guard .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; padding: 0 20px; border-radius: 8px;
    border: 1px solid transparent; font-family: inherit; font-weight: 600; font-size: 15px; line-height: 1; text-decoration: none; white-space: nowrap; box-sizing: border-box; }
  .guard .btn svg { width: 16px; height: 16px; flex: none; }
  .guard .btn--primary { background: #1f62e7; color: #fff; }
  .guard .btn--primary:hover { background: #1546b0; }
  .guard .btn--ghost-dark { background: rgba(255,255,255,0.04); color: #eef2f5; border-color: rgba(255,255,255,0.22); }
  .guard .btn--ghost-dark:hover { background: rgba(255,255,255,0.10); border-color: rgba(255,255,255,0.35); }
  .guard :focus-visible { outline: 3px solid #6af2ff; outline-offset: 2px; }
  @media (max-width: 420px) {
    .guard__cta { flex-direction: column; align-items: center; }
    .guard .btn { width: 100%; max-width: 260px; }
  }
</style>
