  --r-s:8px; --r-m:12px; --r-l:16px; --r-pill:999px;
}
html,body{margin:0;height:100%;font-family:var(--font);color:var(--ink-2);background:#0d1b23;overflow:hidden;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
#map{position:absolute;inset:0;background:#0d1b23}
/* keep Leaflet's top controls clear of the overlaying brand bar */
.leaflet-top{top:56px}
*:focus{outline:none}
*:focus-visible{outline:2px solid var(--accent-l);outline-offset:2px;border-radius:4px}
::selection{background:rgba(31,95,127,.22)}

/* ---------------------------------------------------------- brand bar -- */
#brand{
  position:absolute;top:0;left:0;right:0;height:56px;z-index:1200;box-sizing:border-box;
  display:flex;align-items:center;gap:14px;padding:0 16px;
  background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.7);
  backdrop-filter:blur(14px) saturate(1.7);
  border-bottom:1px solid var(--line);box-shadow:0 1px 6px rgba(9,26,35,.14);
  transition:opacity .35s ease;
}
/* zoomed in, the bar recedes so it never covers site detail; hover restores it */
#brand.dim{opacity:.22;pointer-events:none}
#brand.dim:hover{opacity:1;pointer-events:auto}
#brand::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;
  background:linear-gradient(90deg,var(--brand),var(--accent-l) 55%,var(--site))}
#brand .logo{height:22px;width:auto;max-width:none;display:block;flex:0 0 auto}
#brand .div{width:1px;height:26px;background:var(--line);flex:0 0 auto}
#brand .txt{min-width:0}
#brand .kick{font-weight:700;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#brand .ttl{font-weight:700;font-size:14px;color:var(--brand);line-height:1.2;letter-spacing:-.005em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:620px){
  #brand{gap:10px;padding:0 12px}
  #brand .logo{height:17px}
  #brand .kick{font-size:8.6px;letter-spacing:.14em}
  #brand .ttl{font-size:12px}
}

/* ------------------------------------------------------ map furniture -- */
.leaflet-container{font-family:var(--font);background:#0d1b23}
/* the opening view sits at a half zoom, where scaled tiles can show hairline seams:
   let each tile overlap its neighbour by a fraction of a pixel instead */
.leaflet-container img.leaflet-tile{mix-blend-mode:normal;width:256.6px!important;height:256.6px!important}
.leaflet-touch .leaflet-bar,.leaflet-bar{border:0!important;box-shadow:var(--sh-1)!important;
  border-radius:10px;overflow:hidden}
.leaflet-bar a,.leaflet-bar a:hover{width:30px;height:30px;line-height:30px;
  background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  color:var(--brand);border-bottom:1px solid var(--line);font-size:17px;font-weight:600;
  transition:background .14s,color .14s}
.leaflet-bar a:last-child{border-bottom:0}
.leaflet-bar a:hover{background:#fff;color:var(--accent-l)}
.leaflet-bar a.leaflet-disabled{color:var(--muted-2);background:rgba(255,255,255,.7)}
.leaflet-control-attribution{background:rgba(255,255,255,.86)!important;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border-radius:8px 0 0 0;padding:3px 8px!important;font-size:9.5px!important;color:var(--muted)!important}
.leaflet-control-attribution a{color:var(--accent)!important;text-decoration:none}
.leaflet-control-scale-line{border:1.5px solid rgba(13,27,35,.75);border-top:none;border-radius:0 0 4px 4px;
  background:rgba(255,255,255,.85);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  color:var(--ink);font:700 9.5px/13px var(--font);letter-spacing:.03em;padding:1px 6px 2px}

/* ----------------------------------------------------------- popups ---- */
.leaflet-popup-content-wrapper{border-radius:var(--r-l);box-shadow:var(--sh-2);padding:0;
  background:#fff;overflow:hidden}
.leaflet-popup-content-wrapper::before{content:"";display:block;height:3px;
  background:linear-gradient(90deg,var(--brand),var(--accent-l) 55%,var(--site))}
.leaflet-popup-content{margin:0!important;padding:13px 16px 15px;box-sizing:border-box;
  font-size:11.9px;line-height:1.55;color:var(--ink-2)}
.leaflet-popup-content b{color:var(--ink);font-weight:650}
/* the close button floats over the top-right corner, so the title reserves room for it */
.leaflet-popup-content>b:first-child{
  display:block;margin:0 26px 5px 0;
  color:var(--brand);font-size:12.6px;font-weight:750;line-height:1.35;letter-spacing:-.005em}
.leaflet-popup-content>b:first-child+br{display:none}
.leaflet-popup-tip{box-shadow:none;background:#fff}
.leaflet-container a.leaflet-popup-close-button{top:10px;right:9px;width:24px;height:24px;padding:0;
  display:grid;place-items:center;border-radius:7px;color:var(--muted);font:400 18px/1 var(--font);
  background:var(--tint);transition:background .14s,color .14s}
.leaflet-container a.leaflet-popup-close-button:hover{background:var(--accent);color:#fff}

/* ---------------------------------------------------------- tooltips --- */
.leaflet-tooltip{font-family:var(--font);
  background:var(--glass);-webkit-backdrop-filter:blur(8px) saturate(1.5);backdrop-filter:blur(8px) saturate(1.5);
  border:0;border-radius:var(--r-s);
  box-shadow:0 1px 2px rgba(9,26,35,.2),0 3px 12px rgba(9,26,35,.28);
  color:var(--ink-2);font-size:10.6px;font-weight:650;line-height:1.35;
  padding:4px 9px;max-width:240px;white-space:normal}
.leaflet-tooltip:before{display:none}
.leaflet-tooltip.alab{white-space:nowrap;background:linear-gradient(135deg,var(--brand),var(--accent));color:#fff;
  border:0;border-radius:var(--r-pill);font-weight:700;font-size:10px;letter-spacing:.03em;
  padding:2.5px 9px;box-shadow:0 2px 10px rgba(9,26,35,.35);opacity:1}
.leaflet-tooltip.alab:before{display:none}
.leaflet-tooltip.alab.leaflet-interactive{cursor:pointer}

/* markers */
.pin{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:750;
  border-radius:50%;border:2.5px solid #fff;box-shadow:0 2px 8px rgba(9,26,35,.45);
  font-family:var(--font);font-variant-numeric:tabular-nums;box-sizing:border-box}

/* --- standing caveat, bottom left above the scale bar --- */
#caveat{position:absolute;left:12px;bottom:40px;z-index:1000;max-width:min(320px,calc(100% - 24px));box-sizing:border-box;
  background:var(--glass);-webkit-backdrop-filter:blur(10px) saturate(1.6);
  backdrop-filter:blur(10px) saturate(1.6);border-radius:var(--r-m);
  box-shadow:var(--sh-1);padding:8px 11px;color:var(--muted);
  font-size:10.4px;line-height:1.45}
#caveat b{color:var(--ink-2);font-weight:650}
@media (max-width:620px){
  #caveat{font-size:9.8px;padding:7px 10px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// Bryn Atlas — client build. Generated by build_bryn_atlas.py from the site
// layout in bryn_site.py (the same source the 3D model is built from); do not hand-edit.
const C={chp:'#126181',dig:'#2e9e4f',dc:'#1f62e7'};
const ASSETS=[{"id": "dc", "n": "Proposed BLOX data centre", "cat": "dc", "kind": "poly", "lat": 51.662121, "lon": -3.267544, "poly": [[51.662148, -3.267596], [51.662079, -3.267555], [51.662093, -3.267493], [51.662163, -3.267533]], "note": "Where the BLOX data centre would stand: on the yard a few metres from the LV room at the CHP engines, so its supply is a short connection from there and no cable route across the site is needed. The unit is containerised and stands on its own slab; its only connection to your plant would be that supply. The footprint shown is indicative until the layout is fixed on site."}, {"pin": 1, "id": "chp", "n": "CHP engines", "cat": "chp", "kind": "poly", "lat": 51.66226, "lon": -3.267514, "poly": [[51.662195, -3.267431], [51.662282, -3.267483], [51.662265, -3.267562], [51.662177, -3.26751]], "note": "Your existing biogas engines and their coolers, with the LV room at their south end: the generation the data centre would run from. It would use the site’s surplus power, about 200 kW. No changes to the engines themselves are needed."}, {"pin": 2, "id": "dig", "n": "Digesters", "cat": "dig", "kind": "point", "lat": 51.662498, "lon": -3.268202, "note": "The four digester tanks. Shown for orientation: the proposed plot is by the CHP engines, at the south-east corner of the tank farm."}];

const map=L.map('map',{zoomSnap:.5});
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
 {maxZoom:21,maxNativeZoom:19,attribution:'Imagery © Esri, Maxar, Earthstar Geographics'}).addTo(map);
L.control.scale({imperial:false,position:'bottomleft'}).addTo(map);

const POP={maxWidth:300,autoPanPaddingBottomRight:[40,120],autoPanPaddingTopLeft:[10,62]};
function popup(a){ return '<b>'+a.n+'</b>'+(a.note?('<br>'+a.note):''); }

const assetLayer=L.layerGroup().addTo(map);
const labelled=[];
ASSETS.forEach(a=>{
  const col=C[a.cat]||'#555';
  let g;
  if(a.kind==='poly') g=L.polygon(a.poly,{color:col,weight:2,fillColor:col,
      fillOpacity:a.cat==='dc'?.22:.3,dashArray:a.cat==='dc'?'6,4':null});
  else g=L.circleMarker([a.lat,a.lon],{radius:6,color:'#fff',weight:1.5,fillColor:col,fillOpacity:1});
  // the plot sits under the BLOX badge, so its popup opens clear of the chip
  g.bindPopup(popup(a),a.id==='dc'?Object.assign({offset:[0,-20]},POP):POP).addTo(assetLayer);
  if(a.pin) L.marker([a.lat,a.lon],{icon:L.divIcon({className:'',iconSize:[26,26],iconAnchor:[13,13],
    html:'<div class="pin" style="width:26px;height:26px;background:'+col+';font-size:13px">'+a.pin+'</div>'})})
   .bindPopup(popup(a),POP).addTo(assetLayer);
  labelled.push([a,g]);
});

// short labels appear once the site fills the screen
const SHORT={"dc": "PROPOSED BLOX DATA CENTRE", "chp": "CHP ENGINES", "dig": "DIGESTERS"};
let lblOn=false;
function refreshLabels(){
  const want=map.getZoom()>=17.5;
  if(want===lblOn) return; lblOn=want;
  labelled.forEach(([a,g])=>{
    // labels are clickable: each opens its feature's popup
    const narrow=map.getSize().x<620;
    // on a phone the CHP label sits above its pin so it cannot run off the right-hand edge
    const dir=a.id==='dc'?'bottom':(a.id==='chp'&&narrow?'top':'right');
    const off=a.id==='dc'?[0,30]:(dir==='top'?[0,-16]:[16,a.id==='chp'?-4:0]);
    if(want) g.bindTooltip(SHORT[a.id]||a.n,{permanent:true,interactive:true,direction:dir,className:'alab',offset:off}).openTooltip();
    else g.unbindTooltip();
  });
}
map.on('zoomend',refreshLabels);

// frame the plant and the proposal; a wide screen settles at the atlases' usual 18.5
const FOCUS=L.latLngBounds([[51.661883, -3.268888], [51.662799, -3.266981]]), FOCUS_NARROW=L.latLngBounds([[51.66199, -3.268773], [51.662763, -3.267183]]);
function frame(){
  const narrow=map.getSize().x<620;
  map.fitBounds(narrow?FOCUS_NARROW:FOCUS,{paddingTopLeft:narrow?[10,64]:[24,70],paddingBottomRight:narrow?[10,80]:[24,60],maxZoom:18.5,animate:false});
}
frame();
refreshLabels();
// Streamlit's component frame is briefly narrow while the host page lays out
// (and the attached artifact frame can start at zero size), so settle the
// framing once the page has its real size — unless the visitor has already moved.
(function(){
  let moved=false; map.on('dragstart zoomstart',e=>{ if(e.originalEvent||e.type==='dragstart') moved=true; });
  map.getContainer().addEventListener('wheel',()=>{moved=true;},{passive:true});
  const settle=()=>{ if(moved) return; map.invalidateSize(false); frame(); refreshLabels(); };
  requestAnimationFrame(()=>requestAnimationFrame(settle)); setTimeout(settle,400); setTimeout(settle,1200);
  window.addEventListener('resize',()=>{ map.invalidateSize(false); });
})();

/* the brand bar recedes once the user is zoomed into site detail */
(function(){
  const bar=document.getElementById('brand');
  if(!bar)return;
  const sync=function(){bar.classList.toggle('dim',map.getZoom()>=19.5);};
  map.on('zoomend',sync); sync();
})();
</script>
