name: Keep apps awake

# Streamlit Community Cloud sleeps an app after ~12 hours without a viewer,
# and then greets the next visitor — an investor — with a "get this app back
# up" button. A plain HTTP ping (UptimeRobot, curl, /_stcore/health) returns
# 200 WITHOUT waking the app: the Python app only really wakes, and the idle
# timer only resets, when a browser opens its WebSocket session. So this job
# loads each app in headless Chromium (Playwright) every 3 hours, which is
# well inside the sleep window and survives an occasional late run (GitHub does
# not guarantee schedule timing). This repo is public, so Actions minutes are
# free; the browser is cached, so a run is about a minute.
#
# Same recipe as Eunice-Platform's keep-awake, which has held its apps up since
# June 2026.

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours, UTC
  workflow_dispatch:

permissions:
  contents: read    # checkout only
  issues: write     # open an alert issue if an app can't be woken

concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Visit each app to keep it awake
        run: python .github/scripts/keep_awake.py

      - name: Alert on failure (open/append a GitHub issue, assigned to you)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const marker = 'keep-awake-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);
            const body = [
              `The **keep-awake** check failed on ${today} (UTC) — one or more hosted apps could`,
              `not be confirmed running, so a visitor may be seeing the Streamlit sleep screen.`,
              ``,
              `- Failed run: ${runUrl}`,
              `- Apps: https://investor-insight.streamlit.app/ · https://investor-demo.streamlit.app/ · https://investor-demo-aus.streamlit.app/ · https://peakerplant-3d.streamlit.app/`,
              ``,
              `Open each link to check. If a "get this app back up" button shows, the keep-alive`,
              `step needs a look (Streamlit may have changed the sleep page, or an app errored on boot).`,
              ``,
              `cc @${context.repo.owner}`,
            ].join('\n');
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: marker,
            });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: '⚠️ Keep-awake failed — apps may be asleep',
                body, labels: [marker], assignees: [context.repo.owner],
              });
            }
