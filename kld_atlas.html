<style>
/* ==========================================================================
   KLD Atlas — RenewaBlox design system
   Kinlochdamph 999 kW run-of-river hydro · Loch Damh, Wester Ross
   ========================================================================== */

:root{
  /* brand */
  --brand:#12475e;        /* deep petrol — headings, wordmark            */
  --accent:#1f5f7f;       /* interactive petrol — buttons, links         */
  --accent-d:#16485f;     /* accent, pressed                             */
  --accent-l:#3a89ae;     /* accent, on dark                             */
  /* ink */
  --ink:#0d1b23;
  --ink-2:#33454f;
  --muted:#6a7a83;
  --muted-2:#93a2aa;
  /* surfaces */
  --surface:#ffffff;
  --tint:#f4f8fa;
  --tint-2:#eaf1f5;
  --line:#dfe8ed;
  --line-2:#edf3f6;
  --glass:rgba(255,255,255,.94);
  /* semantic (map + data) */
  --site:#2e9e4f;
  --opt1:#c0392b;
  --opt2:#e67e22;
  --purple:#7d3c98;
  --v33:#2980b9;
  --v132:#8e44ad;
  --v11:#f39c12;
  --hydro:#16a085;
  --good:#1e8449;
  --good-bg:#eef8f1;
  --warn-bg:#fdf6e8;
  /* elevation */
  --sh-1:0 1px 2px rgba(9,26,35,.10), 0 4px 14px rgba(9,26,35,.14);
  --sh-2:0 2px 6px rgba(9,26,35,.12), 0 14px 44px rgba(9,26,35,.24);
  --sh-3:0 24px 70px rgba(0,0,0,.45);
  /* type */
  --font:"Inter","Inter var",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,Consolas,monospace;
  --r-s:8px; --r-m:12px; --r-l:16px; --r-pill:999px;
  --gutter:12px;
  --panel-w:352px;
}

/* --------------------------------------------------------------- shell -- */
html,body{margin:0;height:100%;overflow:hidden;background:#0d1b23}
body{
  font-family:var(--font);
  color:var(--ink-2);
  font-size:12.5px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}
#map{position:absolute;inset:0;background:#0d1b23}
*:focus{outline:none}
*:focus-visible{outline:2px solid var(--accent-l);outline-offset:2px;border-radius:4px}
::selection{background:rgba(31,95,127,.22)}

/* thin, brand-tinted scrollbars everywhere inside the atlas */
.kld-scroll{scrollbar-width:thin;scrollbar-color:#c3d2da transparent}
.kld-scroll::-webkit-scrollbar{width:9px;height:9px}
.kld-scroll::-webkit-scrollbar-track{background:transparent}
.kld-scroll::-webkit-scrollbar-thumb{background:#c9d7de;border-radius:9px;border:3px solid transparent;background-clip:content-box}
.kld-scroll::-webkit-scrollbar-thumb:hover{background:#a8bcc7;background-clip:content-box;border:3px solid transparent}

/* ================================================================ panel == */
.panel{
  position:absolute;top:var(--gutter);right:var(--gutter);
  z-index:1000;width:var(--panel-w);
  max-height:calc(100% - var(--gutter)*2);
  display:flex;flex-direction:column;
  background:var(--glass);
  -webkit-backdrop-filter:blur(14px) saturate(1.7);
  backdrop-filter:blur(14px) saturate(1.7);
  border-radius:var(--r-l);
  box-shadow:var(--sh-2);
  overflow:hidden;
  transform-origin:top right;
  transition:opacity .22s ease, transform .22s cubic-bezier(.2,.8,.3,1);
}
.panel.hidden{opacity:0;transform:scale(.96) translateY(-6px);pointer-events:none}

/* --- panel header (sticky brand bar) --- */
.p-head{
  position:relative;flex:0 0 auto;
  padding:13px 16px 12px;
  background:linear-gradient(180deg,#ffffff 0%,#f7fafc 100%);
  border-bottom:1px solid var(--line);
}
.p-head::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;
  background:linear-gradient(90deg,var(--brand),var(--accent-l) 55%,var(--site))}
.p-brandrow{display:flex;align-items:center;gap:9px}
.p-logo{height:18px;width:auto;display:block;flex:0 0 auto}
.p-badge{
  flex:0 0 auto;white-space:nowrap;
  background:var(--brand);color:#fff;border-radius:var(--r-pill);
  padding:2.5px 8px;font-size:9.5px;font-weight:700;letter-spacing:.09em;line-height:1.35;
}
.p-close{
  margin-left:auto;flex:0 0 auto;
  width:26px;height:26px;display:grid;place-items:center;
  background:var(--tint);border:1px solid var(--line);border-radius:8px;
  color:var(--accent);cursor:pointer;transition:background .15s,color .15s,border-color .15s;
}
.p-close:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.p-close svg{width:13px;height:13px;display:block}
.p-sub{margin:7px 0 0;color:var(--muted);font-size:11.5px;line-height:1.45}

/* --- KPI strip --- */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin:12px -16px -12px;
  background:var(--line);border-top:1px solid var(--line)}
.kpi{background:#fbfdfe;padding:9px 6px 10px;text-align:center}
.kpi b{display:block;font-size:15px;font-weight:750;color:var(--brand);letter-spacing:-.01em;
  font-variant-numeric:tabular-nums;line-height:1.15}
.kpi.neg b{color:var(--opt1)}
.kpi span{display:block;margin-top:2px;font-size:9.5px;color:var(--muted);letter-spacing:.045em;text-transform:uppercase;font-weight:600}

/* --- panel body --- */
/* right padding is trimmed by the width of the 9px scrollbar so the text column
   sits optically centred between the two panel edges */
.p-body{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;padding:2px 8px 16px 16px}

/* --- accordion sections --- */
details.sec{border-bottom:1px solid var(--line-2)}
details.sec:last-of-type{border-bottom:0}
summary.sh{
  list-style:none;cursor:pointer;position:relative;
  display:flex;align-items:center;gap:8px;
  padding:11px 22px 11px 0;
  font-size:10.5px;font-weight:750;letter-spacing:.085em;text-transform:uppercase;
  color:var(--brand);transition:color .15s;
}
summary.sh::-webkit-details-marker{display:none}
summary.sh:hover{color:var(--accent-l)}
summary.sh::after{
  content:"";position:absolute;right:3px;top:50%;
  width:7px;height:7px;margin-top:-5px;
  border-right:1.8px solid var(--muted-2);border-bottom:1.8px solid var(--muted-2);
  transform:rotate(45deg);transform-origin:60% 60%;
  transition:transform .2s ease,border-color .15s;
}
summary.sh:hover::after{border-color:var(--accent-l)}
details[open]>summary.sh::after{transform:rotate(-135deg)}
details.sec>.body{padding:0 0 13px;animation:secIn .22s ease}
@keyframes secIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}

/* --- prose --- */
.prose{font-size:11.8px;line-height:1.58;color:var(--ink-2)}
.prose b{color:var(--ink);font-weight:650}
.prose+.prose{margin-top:9px}
.src{
  margin-top:10px;padding:9px 11px;border-radius:var(--r-s);
  background:var(--tint);border-left:2.5px solid var(--accent-l);
  font-size:10.8px;line-height:1.5;color:var(--muted);
}
.src b{color:var(--ink-2);font-weight:650}

/* --- data tables --- */
table.d{border-collapse:separate;border-spacing:0;width:100%;font-size:11.3px;margin:2px 0 0;
  font-variant-numeric:tabular-nums}
table.d th,table.d td{padding:6px 8px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line-2)}
table.d thead th,table.d tr:first-child th{
  background:var(--tint);color:var(--brand);font-weight:700;font-size:9.8px;
  letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(--line);
}
table.d tr:first-child th:first-child{border-top-left-radius:var(--r-s)}
table.d tr:first-child th:last-child{border-top-right-radius:var(--r-s)}
table.d td:first-child{color:var(--muted);font-weight:600;width:31%}
table.d td:first-child b{color:var(--ink-2)}
table.d tr:last-child td,table.d tr:last-child th{border-bottom:0}
table.d b{color:var(--ink);font-weight:650}
/* the recommended column gets a quiet green wash + accent rail */
table.d .win{background:var(--good-bg);position:relative}
table.d thead .win,table.d tr:first-child .win{background:#e2f2e7;color:var(--good)}
table.d tr:first-child .win{box-shadow:inset 0 2px 0 var(--good)}
table.d .win b{color:var(--good)}
table.d tfoot td,table.d tfoot th,table.d tr.tot td,table.d tr.tot th{
  background:#fbfdfe;font-weight:750;color:var(--ink);border-top:1px solid var(--line)}
table.d tr.tot .win{background:#e2f2e7;color:var(--good)}

/* --- verdict card --- */
.verdict{
  display:flex;align-items:stretch;gap:0;margin-top:11px;
  border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;background:#fff;
}
.verdict>div{flex:1;padding:10px 11px;text-align:center}
.verdict>div+div{border-left:1px solid var(--line)}
.verdict .lose{background:#fdf4f3}
.verdict .wins{background:var(--good-bg)}
.verdict em{display:block;font-style:normal;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
  font-weight:650;color:var(--muted)}
.verdict strong{display:block;margin-top:3px;font-size:17px;font-weight:780;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;line-height:1.1}
.verdict .lose strong{color:var(--opt1)}
.verdict .wins strong{color:var(--good)}
.verdict small{display:block;margin-top:2px;font-size:10px;color:var(--muted)}

/* --- legend --- */
.leg-h{margin:14px 0 6px;font-size:10.5px;font-weight:750;letter-spacing:.085em;
  text-transform:uppercase;color:var(--brand)}
.row{display:flex;align-items:flex-start;gap:9px;padding:5px 0}
.row+.row{border-top:1px solid var(--line-2)}
.swatch{flex:0 0 18px;height:14px;margin-top:2px;display:grid;place-items:center}
.dot{width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 1.5px #fff,0 0 0 2.5px rgba(13,27,35,.18)}
.ln{width:18px;height:0;border-top-width:3px;border-top-style:solid;border-radius:2px}
.row b{display:block;font-size:11.5px;font-weight:650;color:var(--ink)}
.row span{display:block;color:var(--muted);font-size:10.8px;line-height:1.45;margin-top:1px}

/* --- footnote --- */
.note{
  margin-top:14px;padding-top:11px;border-top:1px solid var(--line);
  color:var(--muted-2);font-size:10.3px;line-height:1.5;
}
.note b{color:var(--muted);font-weight:650}
.note a{color:var(--accent);text-decoration:none}
.note a:hover{text-decoration:underline}

/* --- collapsed pill --- */
#panel-pill{
  position:absolute;top:var(--gutter);right:var(--gutter);z-index:1000;
  display:none;align-items:center;gap:7px;
  background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.7);backdrop-filter:blur(14px) saturate(1.7);
  color:var(--brand);border:0;border-radius:var(--r-pill);
  padding:9px 15px 9px 13px;font:750 11.5px/1 var(--font);letter-spacing:.05em;
  cursor:pointer;box-shadow:var(--sh-1);
  transition:transform .16s cubic-bezier(.2,.8,.3,1),box-shadow .16s;
}
#panel-pill.show{display:inline-flex}
#panel-pill:hover{transform:translateY(-1px);box-shadow:var(--sh-2)}
#panel-pill svg{width:14px;height:14px;flex:0 0 auto}

/* ======================================================= map furniture == */
.leaflet-container{font-family:var(--font);background:#0d1b23}
.leaflet-touch .leaflet-bar,.leaflet-bar{border:0!important;box-shadow:var(--sh-1)!important;border-radius:10px;overflow:hidden}
.leaflet-bar a:first-child,.leaflet-bar a:last-child{border-radius:0}
.leaflet-bar a,.leaflet-bar a:hover{
  width:30px;height:30px;line-height:30px;
  background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  color:var(--brand);border-bottom:1px solid var(--line);font-size:17px;font-weight:600;
  transition:background .14s,color .14s;
}
.leaflet-bar a:last-child{border-bottom:0}
.leaflet-bar a:hover{background:#fff;color:var(--accent-l)}
.leaflet-bar a.leaflet-disabled{color:var(--muted-2);background:rgba(255,255,255,.7)}

/* custom view buttons (Site / Region) */
.kld-view{display:flex;flex-direction:column;border-radius:10px;overflow:hidden;box-shadow:var(--sh-1)}
.kld-view button{
  width:30px;height:30px;display:grid;place-items:center;border:0;cursor:pointer;
  background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  color:var(--brand);border-bottom:1px solid var(--line);
  transition:background .14s,color .14s;
}
.kld-view button:last-child{border-bottom:0}
.kld-view button:hover{background:#fff;color:var(--accent-l)}
.kld-view svg{width:15px;height:15px;display:block}

/* layer control */
.leaflet-control-layers{
  border:0!important;border-radius:var(--r-m)!important;box-shadow:var(--sh-1)!important;
  background:var(--glass)!important;-webkit-backdrop-filter:blur(14px) saturate(1.7);backdrop-filter:blur(14px) saturate(1.7);
}
/* Leaflet ships the toggle icon as images/layers.png relative to its stylesheet;
   inside a single-file atlas that URL 404s, so draw it inline instead */
.leaflet-control-layers-toggle,.leaflet-retina .leaflet-control-layers-toggle{
  width:34px!important;height:34px!important;background-size:19px 19px!important;
  background-position:center!important;background-repeat:no-repeat!important;
  background-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%20fill='none'%20stroke='%2312475e'%20stroke-width='1.9'%20stroke-linecap='round'%20stroke-linejoin='round'%3E%3Cpath%20d='M12%202.6l9.4%205.2-9.4%205.2L2.6%207.8%2012%202.6z'/%3E%3Cpath%20d='M2.6%2012.6L12%2017.8l9.4-5.2'/%3E%3Cpath%20d='M2.6%2017L12%2022.2%2021.4%2017'/%3E%3C/svg%3E")!important}
.leaflet-touch .leaflet-control-layers-toggle{width:34px;height:34px}
.leaflet-control-layers-expanded{padding:11px 13px 12px;width:238px;color:var(--ink-2);font-size:11.5px}
.leaflet-control-layers-list{margin:0}
.lc-h{font-size:9.5px;font-weight:750;letter-spacing:.085em;text-transform:uppercase;color:var(--muted);
  margin:0 0 5px;padding:0}
.lc-h+.lc-h,.leaflet-control-layers-separator+.lc-h{margin-top:0}
.leaflet-control-layers label{margin:0;display:block}
.leaflet-control-layers label>div,.leaflet-control-layers label>span{
  display:flex;align-items:center;gap:8px;padding:4px 6px;margin:0 -6px;border-radius:7px;
  cursor:pointer;transition:background .12s;line-height:1.3;
}
.leaflet-control-layers label:hover>div,.leaflet-control-layers label:hover>span{background:var(--tint-2)}
.leaflet-control-layers input[type=checkbox],.leaflet-control-layers input[type=radio]{
  accent-color:var(--accent);width:14px;height:14px;margin:0;flex:0 0 auto;cursor:pointer}
.leaflet-control-layers-separator{border-top:1px solid var(--line);margin:9px 0 8px}
.leaflet-control-layers.kldflag{box-shadow:0 0 0 3px rgba(31,95,127,.9),var(--sh-1)!important}
.leaflet-control-layers.kldflag::before{
  content:"";position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;
  border-radius:10px;background:rgba(31,95,127,.28);animation:b3dpulse 1.8s ease-out infinite;pointer-events:none}
#layers-callout{
  position:absolute;z-index:1001;left:60px;top:92px;
  background:var(--brand);color:#fff;font:650 11.5px var(--font);letter-spacing:.01em;
  padding:8px 12px;border-radius:var(--r-s);box-shadow:var(--sh-1);transition:opacity .6s;
}
#layers-callout::before{content:"";position:absolute;left:-6px;top:12px;
  border:6px solid transparent;border-right-color:var(--brand);border-left:none}

/* attribution + scale */
.leaflet-control-attribution{
  background:rgba(255,255,255,.86)!important;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border-radius:8px 0 0 0;padding:3px 8px!important;font-size:9.5px!important;color:var(--muted)!important}
.leaflet-control-attribution a{color:var(--accent)!important;text-decoration:none}
.leaflet-control-scale-line{
  border:1.5px solid rgba(13,27,35,.75);border-top:none;border-radius:0 0 4px 4px;
  background:rgba(255,255,255,.85);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  color:var(--ink);font:700 9.5px/13px var(--font);letter-spacing:.03em;padding:1px 6px 2px}

/* ---------------------------------------------------------- popups ----- */
.leaflet-popup-content-wrapper{
  border-radius:var(--r-l);box-shadow:var(--sh-2);padding:0;background:#fff;overflow:hidden}
.leaflet-popup-content{margin:0!important;width:326px!important;font-size:12px;line-height:1.55;color:var(--ink-2)}
.leaflet-popup-tip{box-shadow:none;background:#fff}
.leaflet-container a.leaflet-popup-close-button{
  top:9px;right:9px;width:24px;height:24px;padding:0;
  display:grid;place-items:center;border-radius:7px;
  color:rgba(255,255,255,.85);font:400 18px/1 var(--font);
  background:rgba(255,255,255,.16);transition:background .14s,color .14s}
.leaflet-container a.leaflet-popup-close-button:hover{background:rgba(255,255,255,.32);color:#fff}
.pop-h{
  padding:12px 44px 12px 16px;
  background:linear-gradient(135deg,var(--brand),var(--accent) 90%);
  color:#fff;font-size:13px;font-weight:700;letter-spacing:.005em;line-height:1.3}
.pop-h em{display:block;font-style:normal;margin-top:3px;font-size:10.3px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.72)}
.pop-b{box-sizing:border-box;padding:13px 16px 15px;max-height:min(50vh,420px);
  overflow-y:auto;overscroll-behavior:contain}
.pop-b b{color:var(--ink);font-weight:650}
.pop-b ul{margin:9px 0 0;padding:0;list-style:none}
.pop-b li{position:relative;padding:3px 0 3px 15px}
.pop-b li::before{content:"";position:absolute;left:2px;top:10px;width:5px;height:5px;border-radius:50%;
  background:var(--accent-l)}
.pop-b small{color:var(--muted);font-size:10.6px;line-height:1.45;display:block}
.pop-b hr{border:0;border-top:1px solid var(--line-2);margin:11px 0}
.pop-k{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 10px}
.pop-k span{background:var(--tint);border:1px solid var(--line);border-radius:var(--r-pill);
  padding:2px 9px;font-size:10.2px;font-weight:650;color:var(--brand);font-variant-numeric:tabular-nums}
.pop-k span.hot{background:#fdeeec;border-color:#f6d2cd;color:var(--opt1)}
.pop-k span.ok{background:var(--good-bg);border-color:#cfe7d7;color:var(--good)}

/* ------------------------------------------------------- tooltips ------ */
/* Base plate. Several tooltips (outfall, pipe bridge, lodge, intake and the
   whole hydro fleet) are bound with no className, so without this they render
   as unplated dark text straight onto Esri satellite imagery. The skinned
   variants below each override it. */
.leaflet-tooltip{
  border:0;font-family:var(--font);font-size:10.8px;font-weight:650;color:var(--ink);
  background:var(--glass);-webkit-backdrop-filter:blur(8px) saturate(1.5);
  backdrop-filter:blur(8px) saturate(1.5);
  border-radius:var(--r-pill);padding:3px 9px;
  box-shadow:0 1px 2px rgba(9,26,35,.2),0 3px 12px rgba(9,26,35,.28)}
.leaflet-tooltip:before{display:none}
.leaflet-tooltip.lbl{
  background:var(--glass);-webkit-backdrop-filter:blur(8px) saturate(1.5);backdrop-filter:blur(8px) saturate(1.5);
  border:0;border-radius:var(--r-pill);box-shadow:0 1px 2px rgba(9,26,35,.2),0 3px 12px rgba(9,26,35,.28);
  color:var(--ink);font-size:10.8px;font-weight:700;letter-spacing:.01em;padding:3px 9px;white-space:nowrap}
.leaflet-tooltip.lbl.lbl-o1{background:rgba(192,57,43,.96);color:#fff}
.leaflet-tooltip.lbl.lbl-o2{background:rgba(230,126,34,.96);color:#fff}
.leaflet-tooltip.lbl.lbl-site{background:rgba(20,120,60,.96);color:#fff}
.leaflet-tooltip.lbl:before{display:none}
.leaflet-tooltip.box{
  white-space:normal;background:var(--glass);-webkit-backdrop-filter:blur(12px) saturate(1.6);
  backdrop-filter:blur(12px) saturate(1.6);
  border:0;border-radius:var(--r-m);box-shadow:var(--sh-1);
  padding:9px 12px;font-size:11.3px;line-height:1.5;color:var(--ink-2)}
.leaflet-tooltip.box b{color:var(--ink);font-weight:650}
.leaflet-tooltip.box:before{display:none}
.leaflet-tooltip.dlbl{
  background:rgba(255,251,235,.95);border:1px solid #e6cf9a;border-radius:var(--r-pill);
  color:#7a5a12;font-size:10px;font-weight:650;padding:2px 9px;box-shadow:0 2px 8px rgba(9,26,35,.18)}
.leaflet-tooltip.dlbl:before{display:none}
.leaflet-tooltip.plc{
  background:none;border:0;box-shadow:none;color:#fff;font-size:10px;font-weight:650;
  letter-spacing:.09em;text-transform:uppercase;padding:0;
  text-shadow:0 1px 2px rgba(0,0,0,.95),0 0 7px rgba(0,0,0,.7),0 0 2px rgba(0,0,0,.9)}
.leaflet-tooltip.plc:before{display:none}

/* ------------------------------------------------------- 3D gateway ---- *
   Shared with the SRV Atlas so both sites advertise their model the same way:
   a pulsing BLOX chip with a standing call-to-action pill.                   */
.b3d-badge{pointer-events:auto;cursor:pointer}
.b3d-badge .ring{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;
  border-radius:50%;background:rgba(31,95,127,.32);animation:b3dpulse 2.1s cubic-bezier(.2,.6,.35,1) infinite}
.b3d-badge .ring2{animation-delay:1.05s}
.b3d-badge .chip{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:44px;height:44px;border-radius:50%;border:2.5px solid #fff;background:#fff;
  box-shadow:0 2px 12px rgba(9,26,35,.5);transition:transform .18s cubic-bezier(.2,.8,.3,1)}
.b3d-badge:hover .chip{transform:translate(-50%,-50%) scale(1.12)}
.b3d-badge .cta{
  /* the chip is 48px wide centred in the 46px badge div (edges at -1 and 47),
     so the pill must end left of -1 or it covers the B of BLOX */
  position:absolute;right:53px;top:50%;transform:translateY(-50%);
  display:flex;align-items:center;gap:7px;white-space:nowrap;
  background:linear-gradient(135deg,var(--brand),var(--accent) 85%);
  color:#fff;font:700 12px/1 var(--font);letter-spacing:.015em;
  padding:9px 20px 9px 14px;border-radius:var(--r-pill);
  box-shadow:0 3px 16px rgba(9,26,35,.45);
  overflow:hidden;transition:transform .18s cubic-bezier(.2,.8,.3,1),box-shadow .18s}
.b3d-badge:hover .cta{transform:translateY(-50%) translateX(-2px);box-shadow:0 5px 22px rgba(9,26,35,.55)}
.b3d-badge .cta::after{content:"";position:absolute;inset:0;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.28) 48%,transparent 62%);
  transform:translateX(-110%);animation:b3dsheen 4.6s ease-in-out infinite}
.b3d-badge .cta i{font-style:normal;font-size:10px;transition:transform .18s}
.b3d-badge:hover .cta i{transform:translateX(3px)}
.b3d-badge .cta .s{display:none}
/* the pill only earns its space once the map is on the site itself;
   kld_boot.js toggles .cta-on past zoom 13.5 */
/* no transition on opacity: the pill must be correct at a discrete zoom
   threshold, and a transitioned property can stay pinned at its start
   value where frames are not being produced */
.b3d-badge .cta{opacity:0;pointer-events:none}
.b3d-badge.cta-on .cta{opacity:1;pointer-events:auto}
@keyframes b3dpulse{0%{transform:scale(.4);opacity:.95}72%{transform:scale(1.7);opacity:0}100%{opacity:0}}
@keyframes b3dsheen{0%,55%{transform:translateX(-110%)}72%,100%{transform:translateX(115%)}}
@keyframes b3dnudge{0%,100%{transform:translateY(-50%)}30%{transform:translateY(-50%) translateX(-7px)}55%{transform:translateY(-50%)}}
.b3d-badge.nudge .cta{animation:b3dnudge 1s cubic-bezier(.3,.7,.3,1) .9s 2}

/* the same call to action inside the powerhouse popup */
.b3d-poprow{
  display:flex;align-items:center;gap:9px;margin-top:12px;padding:8px 10px;
  background:linear-gradient(135deg,var(--brand),var(--accent) 90%);
  border-radius:9px;cursor:pointer;transition:filter .15s}
.b3d-poprow:hover{filter:brightness(1.15)}
.b3d-poprow img{width:26px;height:26px;border-radius:50%;border:1.5px solid #fff;flex:0 0 auto}
.b3d-poprow b{color:#fff;font:700 11.5px/1.3 var(--font);letter-spacing:.01em;display:block}
.b3d-poprow span{color:rgba(255,255,255,.72);font:500 10px/1.3 var(--font);display:block;margin-top:1px}

/* ==================================================== responsive ======== */
@media (max-width:900px){
  :root{--gutter:10px}
  .panel{
    top:auto;left:var(--gutter);right:var(--gutter);bottom:var(--gutter);width:auto;
    max-height:min(66vh,560px);border-radius:var(--r-l);transform-origin:bottom center}
  .panel.hidden{transform:translateY(10px) scale(.98)}
  .p-body{padding-bottom:14px}
  #panel-pill{top:auto;bottom:var(--gutter);right:var(--gutter)}
  .leaflet-popup-content{width:min(78vw,320px)!important}

function hav(a,b){const p1=rad(a[0]),p2=rad(b[0]),dp=rad(b[0]-a[0]),dl=rad(b[1]-a[1]);
 const h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(h));}

function nearestOnPoly(P,poly){let best=1e12,bi=0,bt=0;
 const lat0=rad(P[0]),mLat=111320,mLon=111320*Math.cos(lat0);
 const xy=p=>[p[1]*mLon,p[0]*mLat];const pp=xy(P);
 for(let i=0;i<poly.length-1;i++){const a=xy(poly[i]),b=xy(poly[i+1]);
  const dx=b[0]-a[0],dy=b[1]-a[1];let t=((pp[0]-a[0])*dx+(pp[1]-a[1])*dy)/((dx*dx+dy*dy)||1e-9);
  t=Math.max(0,Math.min(1,t));const cx=a[0]+t*dx,cy=a[1]+t*dy;const d=Math.hypot(pp[0]-cx,pp[1]-cy);
  if(d<best){best=d;bi=i;bt=t;}}
 const a=poly[bi],b=poly[bi+1];
 return{dist:best,i:bi,t:bt,pt:[a[0]+bt*(b[0]-a[0]),a[1]+bt*(b[1]-a[1])]};}
// find the point on the polyline whose STRAIGHT-LINE distance from P equals target,
// walking from vertex i0 in direction dir (+1 = up-line/NW, -1 = down-line/SE)
function distCross(poly,P,target,i0,dir){let prev=poly[i0];
 for(let j=i0+dir;j>=0&&j<poly.length;j+=dir){const a=prev,b=poly[j];
  const da=hav(P,a),db=hav(P,b);
  if((da-target)*(db-target)<=0){let lo=0,hi=1;
   for(let k=0;k<45;k++){const m=(lo+hi)/2;
    const q=[a[0]+m*(b[0]-a[0]),a[1]+m*(b[1]-a[1])];
    if((hav(P,q)-target)*(da-target)>0)lo=m;else hi=m;}
   const m=(lo+hi)/2;
   return {pt:[a[0]+m*(b[0]-a[0]),a[1]+m*(b[1]-a[1])],far:j};}
  prev=b;}
 return null;}

// The SRV atlas opens over a single yard, so its pill can stand permanently.
// KLD opens on the whole 33 kV spur (fitBounds ≈ zoom 11), where a pill would
// lie across 20 km of network — so the chip alone marks the powerhouse until
// the visitor is close enough for the label to belong to it. Same idea as the
// SRV brand bar dimming past zoom 19.
let ctaShown=false;
function syncCta(){
  const el=kldBadge.getElement&&kldBadge.getElement();
  if(!el) return;
  const near=map.getZoom()>=13.5;
  el.classList.toggle('cta-on',near);
  if(near&&!ctaShown){          // nudge once, the first time it appears
    ctaShown=true;
    setTimeout(function(){
      el.classList.add('nudge');
      setTimeout(function(){ el.classList.remove('nudge'); },4200);
    },450);
  }
}
map.on('zoomend',syncCta);
map.whenReady(syncCta);
setTimeout(syncCta,600);

/* ---------------------------------------------- collapsible info panel -- */
(function(){
  const panel=document.getElementById('panel');
  const toggle=document.getElementById('panel-toggle');
  const pill=document.getElementById('panel-pill');
  if(!panel||!toggle||!pill) return;
  const setOpen=o=>{
    panel.classList.toggle('hidden',!o);
    panel.setAttribute('aria-hidden',String(!o));
    pill.classList.toggle('show',!o);
    toggle.setAttribute('aria-expanded',String(o));
    pill.setAttribute('aria-expanded',String(o));
    if(!o)pill.focus({preventScroll:true}); else toggle.focus({preventScroll:true});
  };
  toggle.addEventListener('click',()=>setOpen(false));
  pill.addEventListener('click',()=>setOpen(true));
  // open on a desk, out of the way on a phone
  const wide=window.matchMedia('(min-width:900px)').matches;
  panel.classList.toggle('hidden',!wide);
  panel.setAttribute('aria-hidden',String(!wide));
  pill.classList.toggle('show',!wide);
  toggle.setAttribute('aria-expanded',String(wide));
  pill.setAttribute('aria-expanded',String(wide));
  // stop map drag/zoom bleeding through the panel and the pill
  [panel,pill].forEach(el=>{L.DomEvent.disableClickPropagation(el);L.DomEvent.disableScrollPropagation(el);});
})();

/* ------------------------------------- first-run flag on the layers UI -- */
(function(){
  const lc=document.querySelector('.leaflet-control-layers');
  if(!lc) return;
  lc.classList.add('kldflag');
  const co=document.createElement('div');
  co.id='layers-callout'; co.textContent='Filter the map layers here';
  document.body.appendChild(co);
  const clear=()=>{
    co.style.opacity='0'; setTimeout(()=>co.remove(),700); lc.classList.remove('kldflag');
    lc.removeEventListener('mouseenter',clear); lc.removeEventListener('click',clear);
  };
  lc.addEventListener('mouseenter',clear); lc.addEventListener('click',clear);
  setTimeout(clear,14000);
})();
</script>
