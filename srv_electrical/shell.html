<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SRV Electrical</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* SRV Electrical: the house brand bar carries the two main views as tabs; each
   view is its own page in a frame below it (sld.html and site3d.html),
   built the first time it is opened. */
:root{
  --bg:#eef2f5; --bar:#ffffff; --fg:#0d1b23; --muted:#5b6876; --line:#d6dde4;
  --brand:#12475e; --accent:#1f5f7f; --accent-l:#3a89ae; --site:#2e9e4f;
  --font:"Inter","Inter var",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --bar-h:56px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161c; --bar:#1a222b; --fg:#e6ebf0; --muted:#98a4b1; --line:#2e3a47;
  --brand:#8cc6e0; --accent:#6fb3d3;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --bar:#1a222b; --fg:#e6ebf0; --muted:#98a4b1; --line:#2e3a47;
  --brand:#8cc6e0; --accent:#6fb3d3;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font:14px/1.4 var(--font)}

#bar{position:fixed;top:0;left:0;right:0;height:var(--bar-h);z-index:2;
  display:flex;align-items:center;gap:14px;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));
  background:var(--bar);border-bottom:1px solid var(--line);box-shadow:0 1px 6px rgba(9,26,35,.12)}
#bar::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;
  background:linear-gradient(90deg,var(--brand),var(--accent-l) 55%,var(--site))}
.logo{height:22px;width:auto;display:block;flex:0 0 auto}
.div{width:1px;height:26px;background:var(--line);flex:0 0 auto}
.ident{min-width:0}
.kick{font-weight:700;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.ttl{font-weight:700;font-size:14px;color:var(--brand);line-height:1.2;letter-spacing:-.005em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.views{margin-left:auto;display:flex;align-self:stretch;gap:2px;flex:0 0 auto}
.views button{position:relative;display:flex;align-items:center;gap:8px;height:100%;padding:0 14px;
  border:0;background:transparent;color:var(--muted);font:600 14px/1 var(--font);cursor:pointer;white-space:nowrap}
.views button:hover{color:var(--fg)}
.views button[aria-selected="true"]{color:var(--fg)}
.views button[aria-selected="true"]::after{content:"";position:absolute;left:8px;right:8px;bottom:-3px;height:3px;
  border-radius:3px 3px 0 0;background:var(--fg);z-index:1}
.views svg{width:17px;height:17px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.views .short{display:none}
.views button:focus-visible{outline:2px solid var(--accent);outline-offset:-6px;border-radius:8px}

.pane{position:fixed;left:0;right:0;bottom:0;top:calc(var(--bar-h) + 2px)}
.pane[hidden]{display:none}
.pane iframe{display:block;width:100%;height:100%;border:0;background:var(--bg)}

/* in dark mode the wordmark's ink would vanish, so invert it and turn the hue
   back round: the petrol reads as a light blue, the black as white */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo{filter:invert(1) hue-rotate(180deg)}}
:root[data-theme="dark"] .logo{filter:invert(1) hue-rotate(180deg)}

@media (max-width:900px){.div,.ident{display:none}}
@media (max-width:560px){
  #bar{gap:10px}
  .logo{height:16px}
  .views button{padding:0 10px;font-size:13.5px;gap:6px}
  .views .long{display:none}
  .views .short{display:inline}
}
@media (max-width:340px){.views svg{display:none}}
</style>
</head>

<script>window.__LV_QUERY = __LV_QUERY__;</script>
<script type="application/json" id="src-sld">__SLD_JSON__</script>
<script type="application/json" id="src-site">__SITE_JSON__</script>
<script>
(() => {
  const VIEWS = ['sld', 'site'];
  const TITLES = { sld:'Single-line diagram', site:'Site view: 3D model of the site' };
  const Q = window.__LV_QUERY || {};
  const tabs = {}, panes = {}, frames = {}, ready = {};
  for (const k of VIEWS) { tabs[k] = document.getElementById('v-' + k); panes[k] = document.getElementById('p-' + k); }

  /* the design (What was designed / What we need), operating state and open step
     of What we need the reader last picked: both views show the same, so flipping
     between them is the same moment seen two ways */
  const step0 = Number.isInteger(Q.step) ? Q.step : null;
  const pick = { tab: Q.design === 'ours' || step0 !== null ? 'ours' : 'lee', idx: Number.isInteger(Q.state) ? Q.state : 0, step: step0 };
  addEventListener('message', e => {
    const d = e.data && e.data.lv;
    if (!d || !VIEWS.some(k => frames[k] && frames[k].contentWindow === e.source)) return;
    if (d.tab === 'lee' || d.tab === 'ours') pick.tab = d.tab;
    if (Number.isInteger(d.idx)) pick.idx = d.idx;
    if (d.step === null || Number.isInteger(d.step)) pick.step = d.step;
  });
  function sync(k) { try { frames[k].contentWindow.LV.show(pick.tab, pick.idx, pick.step); } catch (e) {} }

  /* each view's page is built into a frame the first time it is opened, so
     three.js and the 3D site model (fetched from the app's static folder) only
     load when someone opens the site view */
  function build(k) {
    const f = document.createElement('iframe');
    f.title = TITLES[k];
    f.srcdoc = JSON.parse(document.getElementById('src-' + k).textContent);
    f.addEventListener('load', () => {
      let url = '';
      try { url = f.contentWindow.location.href; } catch (e) {}
      if (url !== 'about:srcdoc') return;
      ready[k] = true; sync(k);
    });
    panes[k].appendChild(f);
    frames[k] = f;
  }

  let view = null;
  function open(k) {
    if (k === view) return;
    view = k;
    for (const kk of VIEWS) {
      const on = kk === k;
      tabs[kk].setAttribute('aria-selected', on ? 'true' : 'false');
      tabs[kk].tabIndex = on ? 0 : -1;
      panes[kk].hidden = !on;
    }
    if (!frames[k]) { build(k); return; }
    if (ready[k]) {
      sync(k);
      try { frames[k].contentWindow.dispatchEvent(new Event('resize')); } catch (e) {}
    }
  }

  for (const k of VIEWS) tabs[k].addEventListener('click', () => open(k));
  document.querySelector('.views').addEventListener('keydown', e => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const i = VIEWS.indexOf(view);
    const j = e.key === 'ArrowRight' ? (i + 1) % VIEWS.length
            : e.key === 'ArrowLeft' ? (i + VIEWS.length - 1) % VIEWS.length
            : e.key === 'Home' ? 0 : e.key === 'End' ? VIEWS.length - 1 : -1;
    if (j < 0) return;
    e.preventDefault(); open(VIEWS[j]); tabs[VIEWS[j]].focus();
  });

  open(Q.view === 'site' ? 'site' : 'sld');
})();
</script>
