# atlas.renewablox.com — the RenewaBlox Atlas (build.py beside this file).
# The renewablox-atlas Netlify project, with atlas/ as its base directory, so this file, not the energy site's
# netlify.toml at the root of the repository, configures it. Netlify builds the site on a push to the project's
# production branch (live) that changes one of the site's inputs; the header rules are in root/_headers, with
# the investor portal's added by build.py, and the sign-in sets the gated pages' own.
#
# The build refuses to run here without the list of names the clients' public covers must never carry: set ATLAS_NAMES
# (comma-separated) in the project's environment variables, marked secret, never in this file.

# Pages under /clients/ and /team/ pass through the sign-in, the edge function in netlify/edge-functions/; its settings
# are described at the top of the file.
#
# Every build and deploy costs Netlify credits, so the ignore command skips a push that changes none of the site's
# inputs (inputs.txt: this folder and the pages it reads from the root of the repository; the build fails if it
# reads a file the list doesn't cover). After the build, the sign-in's tests run (tests/gates.test.mjs); a gate
# that fails them is never deployed.

[build]
  command = "python3 build.py && node tests/gates.test.mjs"
  publish = "site"
  ignore = "bash ../tools/netlify-ignore.sh atlas/inputs.txt"

[build.environment]
  PYTHON_VERSION = "3.12"
  NODE_VERSION = "22"
  # ATLAS_NAMES is marked secret, and Netlify fails any build in which a secret's value appears. Its words are site and
  # place names that rightly appear elsewhere on the site (the public datasets, the signed-in client pages); the
  # build's own check keeps them off the public cover, so Netlify's scan leaves that one variable out.
  SECRETS_SCAN_OMIT_KEYS = "ATLAS_NAMES"
