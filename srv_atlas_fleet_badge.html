  function viewUrl(view){
    var href = '';
    try { href = window.parent.location.href; } catch(e){}
    if (!href) href = document.referrer || '';
    try {
      var u = new URL(href);
      u.searchParams.set('view', view);
      u.searchParams.delete('embed');
      u.hash = '';
      return u.toString();
    } catch(e) { return '?view=' + view; }
  }
  // Navigate the whole page from inside Streamlit's sandboxed component iframe,
  // exactly as the generated badge layer does: a click on an anchor in the
  // PARENT document, else rewrite the parent's history entry and reload it,
  // else a new tab.
  function rbxGo(url){
    var fallback = setTimeout(function(){
      try { window.parent.history.pushState(null, '', url); window.parent.location.reload(); }
      catch(e) { window.open(url, '_blank', 'noopener'); }
    }, 1200);
    window.addEventListener('pagehide', function(){ clearTimeout(fallback); }, { once: true });
    try {
      var pd = window.parent.document;
      var a = pd.createElement('a');
      a.href = url; a.target = '_self'; a.style.display = 'none';
      pd.body.appendChild(a); a.click(); a.remove();
    } catch(e) {
      clearTimeout(fallback);
      try { window.parent.history.pushState(null, '', url); window.parent.location.reload(); }
      catch(e2) { window.open(url, '_blank', 'noopener'); }
    }
  }
  function openFleet(){ rbxGo(viewUrl('fleet')); }

  /* ------------------------------------------------- the badge on the map */

  // 85 px below the kiosk badge's, pill to the right like it: the two read as
  // a pair over the yard, and the offset holds at any viewport.
  var m = L.marker([53.176878, -0.110333], {
    zIndexOffset: 4000,
    keyboard: true,
    title: 'ASIC Deployment: 40, 44 or 50 miners',

    })
  });

  // one nudge after the other two badges' (0.7 s and 1.5 s)
  setTimeout(function(){
    var el = m.getElement && m.getElement();
    if (el){ el.classList.add('nudge'); setTimeout(function(){ el.classList.remove('nudge'); }, 4200); }
  }, 2300);

  /* ------------------------- keep all three badges on screen on a narrow map */
  // The map opens centred for a desktop, so on a phone the 3D Dispatch Sim
  // badge falls off the left edge. If the badges do not all fit, pan the map
  // sideways to centre them, until the visitor moves the map themselves.
  // Checked more than once, because Streamlit's component iframe is briefly
  // narrow while the host page lays out.
  var touched = false;
  map.on('dragstart zoomstart', function(){ touched = true; });
  function fitBadges(){
    if (touched) return;
    var l = Infinity, r = -Infinity, parts = document.querySelectorAll('.b3d-badge .chip, .b3d-badge .cta');
    for (var i = 0; i < parts.length; i++) { var b = parts[i].getBoundingClientRect(); if (b.width) { l = Math.min(l, b.left); r = Math.max(r, b.right); } }
    var W = map.getSize().x;
    if (!isFinite(l) || (l >= 8 && r <= W - 8)) return;
    map.panBy([Math.round((l + r) / 2 - W / 2), 0], { animate: false });
  }
  [0, 400, 1200].forEach(function(t){ setTimeout(fitBadges, t); });
