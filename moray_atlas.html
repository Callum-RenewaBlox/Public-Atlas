<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#12475e">
<meta name="description" content="Moray Cluster Atlas - the Keith and Huntly primaries, the only two green-headroom primaries in the Savills Moray screen: BLOX candidate plots, landowners, GSP saturation, the 33/132/275/400 kV network and the offshore wind that lands on it.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%2312475e'/%3E%3Cpath%20d='M16%205.6c4.5%205.5%206.8%209.1%206.8%2012A6.8%206.8%200%200%201%2016%2024.4a6.8%206.8%200%200%201-6.8-6.8C9.2%2014.7%2011.5%2011.1%2016%205.6z'%20fill='%23fff'/%3E%3C/svg%3E">
<title>Moray Cluster Atlas — Keith &amp; Huntly</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* ===================================================================
   RenewaBlox design system — Moray Cluster Atlas
   Ported from the KLD Atlas (Contracts/Kinlochdamph/Atlas/parts/
   kld_style.css) so the two public atlases share one visual language:
   the same petrol brand tokens, Inter type stack, glass panel, brand
   bar, accordion sections and map furniture. Moray-only additions are
   the RAG classes, ownership swatches and the view switcher.
   =================================================================== */

:root{
  /* brand */
  --brand:#12475e;        /* deep petrol - headings, wordmark            */
  --accent:#1f5f7f;       /* interactive petrol - buttons, links         */
  --accent-d:#16485f;     /* accent, pressed                             */
  --accent-l:#3a89ae;     /* accent, on dark                             */
  /* ink */
  --ink:#0d1b23;
  --ink-2:#33454f;
  --muted:#6a7a83;
  --muted-2:#93a2aa;
  /* surfaces */
  --surface:#ffffff;
  --tint:#f4f8fa;
  --tint-2:#eaf1f5;
  --line:#dfe8ed;
  --line-2:#edf3f6;
  --glass:rgba(255,255,255,.94);
  /* semantic (map + data) */
  --site:#2e9e4f;
  --opt1:#c0392b;
  --opt2:#e67e22;
  --good:#1e8449;
  --good-bg:#eef8f1;
  --warn:#e8a33d;
  --warn-bg:#fdf6e8;
  --blox:#123c74;
  /* elevation */
  --sh-1:0 1px 2px rgba(9,26,35,.10), 0 4px 14px rgba(9,26,35,.14);
  --sh-2:0 2px 6px rgba(9,26,35,.12), 0 14px 44px rgba(9,26,35,.24);
  /* type */
  --font:"Inter","Inter var",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,Consolas,monospace;
  --r-s:8px; --r-m:12px; --r-l:16px; --r-pill:999px;
  --gutter:12px;
  --panel-w:360px;
}

html,body{
  margin:0;height:100%;
  font-family:var(--font);color:var(--ink-2);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}
#map{position:absolute;inset:0;background:#0d1b23}
*:focus{outline:none}
*:focus-visible{outline:2px solid var(--accent-l);outline-offset:2px;border-radius:4px}
::selection{background:rgba(31,95,127,.22)}

/* thin, brand-tinted scrollbars everywhere inside the atlas */
.rbx-scroll{scrollbar-width:thin;scrollbar-color:#c3d2da transparent}
.rbx-scroll::-webkit-scrollbar{width:9px;height:9px}
.rbx-scroll::-webkit-scrollbar-track{background:transparent}
.rbx-scroll::-webkit-scrollbar-thumb{background:#c9d7de;border-radius:9px;border:3px solid transparent;background-clip:content-box}
.rbx-scroll::-webkit-scrollbar-thumb:hover{background:#a8bcc7;background-clip:content-box;border:3px solid transparent}

/* ================================================================ panel == */
.panel{
  position:absolute;top:var(--gutter);right:var(--gutter);
  z-index:1000;width:var(--panel-w);
  max-height:calc(100% - var(--gutter)*2);
  display:flex;flex-direction:column;
  background:var(--glass);
  -webkit-backdrop-filter:blur(14px) saturate(1.7);
  backdrop-filter:blur(14px) saturate(1.7);
  border-radius:var(--r-l);
  box-shadow:var(--sh-2);
  overflow:hidden;
  transform-origin:top right;
  transition:opacity .22s ease, transform .22s cubic-bezier(.2,.8,.3,1);
}
.panel.hidden{opacity:0;transform:scale(.96) translateY(-6px);pointer-events:none}

/* --- panel header (sticky brand bar) --- */
.p-head{
  position:relative;flex:0 0 auto;
  padding:13px 16px 12px;
  background:linear-gradient(180deg,#ffffff 0%,#f7fafc 100%);
  border-bottom:1px solid var(--line);
}
.p-head::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;
  background:linear-gradient(90deg,var(--brand),var(--accent-l) 55%,var(--site))}
.p-brandrow{display:flex;align-items:center;gap:9px}
.p-logo{height:18px;width:auto;display:block;flex:0 0 auto}
.p-badge{
  flex:0 0 auto;white-space:nowrap;
  background:var(--brand);color:#fff;border-radius:var(--r-pill);
  padding:2.5px 8px;font-size:9.5px;font-weight:700;letter-spacing:.09em;line-height:1.35;
}
.p-close{
  margin-left:auto;flex:0 0 auto;
  width:26px;height:26px;display:grid;place-items:center;
  background:var(--tint);border:1px solid var(--line);border-radius:8px;
  color:var(--accent);cursor:pointer;transition:background .15s,color .15s,border-color .15s;
}
.p-close:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.p-close svg{width:13px;height:13px;display:block}
.p-sub{margin:7px 0 0;color:var(--muted);font-size:11.5px;line-height:1.45}
.p-sub b{color:var(--ink-2);font-weight:650}

/* --- KPI strip --- */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin:12px -16px 0;
  background:var(--line);border-top:1px solid var(--line)}
.kpi{background:#fbfdfe;padding:9px 6px 10px;text-align:center}
.kpi b{display:block;font-size:15px;font-weight:750;color:var(--brand);letter-spacing:-.01em;
  font-variant-numeric:tabular-nums;line-height:1.15}
.kpi.pos b{color:var(--good)}
.kpi.neg b{color:var(--opt1)}
.kpi span{display:block;margin-top:2px;font-size:9.5px;color:var(--muted);letter-spacing:.045em;
  text-transform:uppercase;font-weight:600}

/* --- view switcher (Keith / Huntly / Region) --- */
.p-views{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin:0 -16px -12px;
  background:var(--line);border-top:1px solid var(--line)}
.p-views button{
  border:0;background:#fff;color:var(--accent);cursor:pointer;
  font:700 10.5px/1 var(--font);letter-spacing:.055em;text-transform:uppercase;
  padding:9px 4px;transition:background .14s,color .14s;
}
.p-views button:hover{background:var(--tint-2);color:var(--brand)}
.p-views button:active{background:var(--accent);color:#fff}

/* --- panel body --- */
/* right padding is trimmed by the width of the 9px scrollbar so the text column
   sits optically centred between the two panel edges */
.p-body{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;padding:2px 8px 16px 16px}

/* --- accordion sections --- */
details.sec{border-bottom:1px solid var(--line-2)}
details.sec:last-of-type{border-bottom:0}
summary.sh{
  list-style:none;cursor:pointer;position:relative;
  display:flex;align-items:center;gap:8px;
  padding:11px 22px 11px 0;
  font-size:10.5px;font-weight:750;letter-spacing:.085em;text-transform:uppercase;
  color:var(--brand);transition:color .15s;
}
summary.sh::-webkit-details-marker{display:none}
summary.sh:hover{color:var(--accent-l)}
summary.sh::after{
  content:"";position:absolute;right:3px;top:50%;
  width:7px;height:7px;margin-top:-5px;
  border-right:1.8px solid var(--muted-2);border-bottom:1.8px solid var(--muted-2);
  transform:rotate(45deg);transform-origin:60% 60%;
  transition:transform .2s ease,border-color .15s;
}
summary.sh:hover::after{border-color:var(--accent-l)}
details[open]>summary.sh::after{transform:rotate(-135deg)}
details.sec[open]{padding-bottom:11px}
details.sec>*:not(summary){animation:secIn .22s ease}
@keyframes secIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}

/* --- legend heading --- */
h2{margin:15px 0 5px;font-size:10.5px;font-weight:750;letter-spacing:.085em;
  text-transform:uppercase;color:var(--brand)}

/* --- prose ---
   The source reuses .note both for section prose (with the border/margin
   stripped inline) and for the closing footnote, so .note reads as prose and
   the panel-level footnote is toned down separately. */
.note{color:var(--ink-2);font-size:11.6px;line-height:1.56}
.note b{color:var(--ink);font-weight:650}
.note a{color:var(--accent);text-decoration:none}
.note a:hover{text-decoration:underline}
.p-body>.note{
  margin-top:14px;padding-top:11px;border-top:1px solid var(--line);
  color:var(--muted-2);font-size:10.3px;line-height:1.5;
}
.p-body>.note b{color:var(--muted);font-weight:650}

/* --- data tables --- */
table.d{border-collapse:separate;border-spacing:0;width:100%;font-size:11.3px;margin:2px 0 0;
  font-variant-numeric:tabular-nums}
table.d th,table.d td{padding:6px 8px;text-align:left;vertical-align:top;
  border-bottom:1px solid var(--line-2)}
table.d tr:first-child th{
  background:var(--tint);color:var(--brand);font-weight:700;font-size:9.8px;
  letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(--line);
}
table.d tr:first-child th:first-child{border-top-left-radius:var(--r-s)}
table.d tr:first-child th:last-child{border-top-right-radius:var(--r-s)}
table.d td:first-child{color:var(--ink-2);font-weight:600}
table.d tr:last-child td,table.d tr:last-child th{border-bottom:0}
table.d b{color:var(--ink);font-weight:650}
table.d tr:hover td{background:var(--tint)}

/* RAG + status emphasis */
.g{color:var(--good);font-weight:700}
.a{color:#b8781a;font-weight:700}
.r{color:var(--opt1);font-weight:700}

/* --- legend rows --- */
.row{display:flex;align-items:flex-start;gap:9px;padding:5px 0}
.row+.row{border-top:1px solid var(--line-2)}
.dot{width:12px;height:12px;border-radius:50%;margin-top:3px;flex:0 0 auto;
  box-shadow:0 0 0 1.5px #fff,0 0 0 2.5px rgba(13,27,35,.18)}
.sq{width:12px;height:12px;border-radius:3px;margin-top:3px;flex:0 0 auto;
  box-shadow:0 0 0 1px rgba(13,27,35,.18)}
.ln{width:18px;height:0;border-top-width:3px;border-top-style:solid;border-radius:2px;
  margin-top:8px;flex:0 0 auto}
.row b{display:block;font-size:11.5px;font-weight:650;color:var(--ink)}
.row span{display:block;color:var(--muted);font-size:10.8px;line-height:1.45;margin-top:1px}

/* --- collapsed pill --- */
#panel-pill{
  position:absolute;top:var(--gutter);right:var(--gutter);z-index:1000;
  display:none;align-items:center;gap:7px;
  background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.7);
  backdrop-filter:blur(14px) saturate(1.7);
  color:var(--brand);border:0;border-radius:var(--r-pill);
  padding:9px 15px 9px 13px;font:750 11.5px/1 var(--font);letter-spacing:.05em;
  cursor:pointer;box-shadow:var(--sh-1);
  transition:transform .16s cubic-bezier(.2,.8,.3,1),box-shadow .16s;
}
#panel-pill.show{display:inline-flex}
#panel-pill:hover{transform:translateY(-1px);box-shadow:var(--sh-2)}
#panel-pill svg{width:14px;height:14px;flex:0 0 auto}

/* ======================================================= map furniture == */
.leaflet-container{font-family:var(--font);background:#0d1b23}
.leaflet-touch .leaflet-bar,.leaflet-bar{border:0!important;box-shadow:var(--sh-1)!important;
  border-radius:10px;overflow:hidden}
.leaflet-bar a:first-child,.leaflet-bar a:last-child{border-radius:0}
.leaflet-bar a,.leaflet-bar a:hover{
  width:30px;height:30px;line-height:30px;
  background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  color:var(--brand);border-bottom:1px solid var(--line);font-size:17px;font-weight:600;
  transition:background .14s,color .14s;
}
.leaflet-bar a:last-child{border-bottom:0}
.leaflet-bar a:hover{background:#fff;color:var(--accent-l)}
.leaflet-bar a.leaflet-disabled{color:var(--muted-2);background:rgba(255,255,255,.7)}

/* layer control */
.leaflet-control-layers{
  border:0!important;border-radius:var(--r-m)!important;box-shadow:var(--sh-1)!important;
  background:var(--glass)!important;-webkit-backdrop-filter:blur(14px) saturate(1.7);
  backdrop-filter:blur(14px) saturate(1.7);
}
.leaflet-control-layers-toggle,.leaflet-retina .leaflet-control-layers-toggle{
  width:34px!important;height:34px!important;background-size:19px 19px!important;
  background-position:center!important;background-repeat:no-repeat!important;
  background-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%20fill='none'%20stroke='%2312475e'%20stroke-width='1.9'%20stroke-linecap='round'%20stroke-linejoin='round'%3E%3Cpath%20d='M12%202.6l9.4%205.2-9.4%205.2L2.6%207.8%2012%202.6z'/%3E%3Cpath%20d='M2.6%2012.6L12%2017.8l9.4-5.2'/%3E%3Cpath%20d='M2.6%2017L12%2022.2%2021.4%2017'/%3E%3C/svg%3E")!important}
.leaflet-touch .leaflet-control-layers-toggle{width:34px;height:34px}
.leaflet-control-layers-expanded{padding:11px 13px 12px;color:var(--ink-2);font-size:11.5px}
.leaflet-control-layers-list{margin:0}
.leaflet-control-layers label{margin:0;display:block}
.leaflet-control-layers label>div,.leaflet-control-layers label>span{
  display:flex;align-items:center;gap:8px;padding:4px 6px;margin:0 -6px;border-radius:7px;
  cursor:pointer;transition:background .12s;line-height:1.3;
}
.leaflet-control-layers label:hover>div,.leaflet-control-layers label:hover>span{background:var(--tint-2)}
.leaflet-control-layers input[type=checkbox],.leaflet-control-layers input[type=radio]{
  accent-color:var(--accent);width:14px;height:14px;margin:0;flex:0 0 auto;cursor:pointer}
.leaflet-control-layers-separator{border-top:1px solid var(--line);margin:9px 0 8px}

/* attribution + scale */
.leaflet-control-attribution{
  background:rgba(255,255,255,.86)!important;-webkit-backdrop-filter:blur(8px);
  backdrop-filter:blur(8px);
  border-radius:8px 0 0 0;padding:3px 8px!important;font-size:9.5px!important;
  color:var(--muted)!important}
.leaflet-control-attribution a{color:var(--accent)!important;text-decoration:none}
.leaflet-control-scale-line{
  border:1.5px solid rgba(13,27,35,.75);border-top:none;border-radius:0 0 4px 4px;
  background:rgba(255,255,255,.85);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  color:var(--ink);font:700 9.5px/13px var(--font);letter-spacing:.03em;padding:1px 6px 2px}

/* ---------------------------------------------------------- popups ----- */
.leaflet-popup-content-wrapper{
  border-radius:var(--r-l);box-shadow:var(--sh-2);padding:0;background:#fff;overflow:hidden}
.leaflet-popup-content{
  margin:0!important;width:312px!important;
  padding:14px 16px 15px;box-sizing:border-box;
  max-height:min(52vh,430px);overflow-y:auto;overscroll-behavior:contain;
  font-size:11.9px;line-height:1.55;color:var(--ink-2)}
.leaflet-popup-content-wrapper::before{
  content:"";display:block;height:3px;
  background:linear-gradient(90deg,var(--brand),var(--accent-l) 55%,var(--site))}
.leaflet-popup-tip{box-shadow:none;background:#fff}
.leaflet-popup-content b{color:var(--ink);font-weight:650}
/* the first bold in a popup is the title in every bindPopup on this map */
.leaflet-popup-content>b:first-child{
  display:block;margin:0 22px 7px 0;color:var(--brand);
  font-size:13.5px;font-weight:750;letter-spacing:-.005em;line-height:1.3}
.leaflet-popup-content i{color:var(--muted);font-style:normal}
.leaflet-popup-content hr{border:0;border-top:1px solid var(--line-2);margin:10px 0}
.leaflet-popup-content ul{margin:8px 0 0;padding:0;list-style:none}
.leaflet-popup-content li{position:relative;padding:3px 0 3px 15px}
.leaflet-popup-content li::before{content:"";position:absolute;left:2px;top:10px;width:5px;height:5px;
  border-radius:50%;background:var(--accent-l)}
.leaflet-popup-content table.d{margin-top:8px}
.leaflet-container a.leaflet-popup-close-button{
  top:10px;right:9px;width:24px;height:24px;padding:0;
  display:grid;place-items:center;border-radius:7px;
  color:var(--muted);font:400 18px/1 var(--font);
  background:var(--tint);transition:background .14s,color .14s}
.leaflet-container a.leaflet-popup-close-button:hover{background:var(--accent);color:#fff}

/* ------------------------------------------------------- tooltips ------ */
.leaflet-tooltip{border:0;box-shadow:none;padding:0;background:none;font-family:var(--font)}
.leaflet-tooltip.lbl{
  background:var(--glass);-webkit-backdrop-filter:blur(8px) saturate(1.5);
  backdrop-filter:blur(8px) saturate(1.5);
  border:0;border-radius:var(--r-pill);
  box-shadow:0 1px 2px rgba(9,26,35,.2),0 3px 12px rgba(9,26,35,.28);
  color:var(--ink);font-size:10.8px;font-weight:700;letter-spacing:.01em;
  padding:3px 9px;white-space:nowrap}
.leaflet-tooltip.lbl:before{display:none}
.leaflet-tooltip.dlbl{
  background:rgba(255,251,235,.95);border:1px solid #e6cf9a;border-radius:var(--r-pill);
  color:#7a5a12;font-size:10px;font-weight:650;padding:2px 9px;
  box-shadow:0 2px 8px rgba(9,26,35,.18)}
.leaflet-tooltip.dlbl:before{display:none}
.leaflet-tooltip.blx{
  background:linear-gradient(135deg,var(--blox),#1b5aa8);color:#fff;
  border:0;border-radius:var(--r-pill);
  font-size:10px;font-weight:700;letter-spacing:.03em;padding:2.5px 9px;
  box-shadow:0 2px 10px rgba(9,26,35,.35)}
.leaflet-tooltip.blx:before{display:none}

/* ==================================================== responsive ======== */
@media (max-width:900px){
  :root{--gutter:10px}
  .panel{
    top:auto;left:var(--gutter);right:var(--gutter);bottom:var(--gutter);width:auto;
    max-height:min(66vh,560px);border-radius:var(--r-l);transform-origin:bottom center}
  .panel.hidden{transform:translateY(10px) scale(.98)}
  .p-body{padding-bottom:14px}
  #panel-pill{top:auto;bottom:var(--gutter);right:var(--gutter)}
  .leaflet-popup-content{width:min(78vw,312px)!important}
}
@media (max-width:520px){
  .p-logo{height:16px}
  .kpi b{font-size:14px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important}
}

</style>
</head>
<body>
<div id="map" role="application" aria-label="Interactive map of the RenewaBlox Moray cluster: the Keith and Huntly primaries, BLOX candidate plots, landowners and the surrounding 33/132/275/400 kV network"></div>

<aside class="panel" id="panel" aria-label="Moray cluster briefing">

  .bindTooltip(s.name+(s.ap?' (approx.)':''),{permanent:['Blackhillock 400/275/132 kV','Keith GSP (Keith 1 & 2, 132/33 kV)','New Deer 275 kV'].indexOf(s.name)>=0,direction:'top',className:'lbl'})
  .bindPopup('<b>'+s.name+'</b>'+(s.ap?' <i>(location approximate)</i>':'')+'<br><br>'+s.note).addTo(gridLayer);
});

// --- Onshore wind layer
const windLayer=L.layerGroup();
onshore.forEach(w=>{const [n,mw,st,lat,lon,note]=w;
 const col=st==='op'?C.windop:st==='uc'?C.winduc:st==='cons'?'#6aa84f':C.windpl;
 const r=Math.max(5,Math.min(16,4+Math.sqrt(mw)*1.05));
 L.circleMarker([lat,lon],{radius:r,color:'#0b3d1e',weight:1.4,fillColor:col,fillOpacity:.85})
  .bindTooltip(n+' — '+mw+' MW ('+({op:'operational',uc:'under construction',cons:'consented',plan:'in planning'})[st]+')',{sticky:true})
  .bindPopup('<b>'+n+'</b> — '+mw+' MW · '+({op:'Operational',uc:'Under construction',cons:'Consented',plan:'In planning'})[st]+'<br><br>'+note).addTo(windLayer);
});

// --- Offshore layer
const owfLayer=L.layerGroup();
const OWFC={op:'#16a085',cons:'#e67e22',dev:'#7f8ca6'};
const OWFW={op:'operational',cons:'consented',dev:'planned'};
offshore.forEach(w=>{
 const col=OWFC[w.cls];
 L.polygon(w.poly,{color:col,weight:w.cls==='op'?1.6:2,dashArray:w.cls==='op'?null:'6,5',fillColor:col,fillOpacity:w.cls==='op'?.38:.28})
  .bindTooltip(w.n+' — '+(w.mw>=1000?(w.mw/1000).toFixed(w.mw%1000?1:0)+' GW':w.mw+' MW')+' ('+OWFW[w.cls]+')',{permanent:true,direction:'center',className:'lbl'})
  .bindPopup('<b>'+w.n+'</b> — '+w.mw+' MW · <b style="color:'+col+'">'+OWFW[w.cls].toUpperCase()+'</b><br>'+w.own+'<br>'+w.st+'<br><br><b>Connection:</b> '+w.conn+'<br><small>'+(w.ap?'Array extent indicative':'Array extent from EMODnet windfarmspoly WFS')+'</small>').addTo(owfLayer);
});
cables.forEach(cb=>{L.polyline(cb.w,{color:C.owf,weight:2,opacity:.8,dashArray:cb.dash?'3,6':'7,5'}).bindTooltip(cb.n,{sticky:true}).addTo(owfLayer);});

// --- Storage layer
const bessLayer=L.layerGroup();
bess.forEach(b=>{const [n,mw,note,lat,lon]=b;
 const r=Math.max(6,Math.min(15,5+Math.sqrt(mw||4)*.55));
 L.marker([lat,lon],{icon:L.divIcon({className:'',iconSize:[r*2,r*2],iconAnchor:[r,r],html:'<div style="width:'+r*2+'px;height:'+r*2+'px;background:'+C.bess+';border:1.6px solid #063; border-radius:3px;opacity:.9"></div>'})})
  .bindTooltip(n+(mw?' — '+mw+' MW':''),{sticky:true})
  .bindPopup('<b>'+n+'</b>'+(mw?' — '+mw+' MW':'')+'<br><br>'+note).addTo(bessLayer);
});

'<details class="sec" open><summary class="sh">Why here — the thesis</summary><div class="note" style="border:0;margin:0;padding:0">'+
'Keith (<b class="g">6.42 MVA</b>) and Huntly (<b class="g">8.08 MVA</b>) are the ONLY two green-headroom primaries in the Savills Moray screen, and SSEN\'s March 2026 dashboard confirms both exactly. Around them, <b>generation headroom is 0.00 MW (RED) at every primary</b> — the network is export-saturated by wind, and it is <b>demand</b> the local grid can absorb. The Blackhillock hub 2 km from the Keith site already lands <b>Beatrice (588 MW)</b>, <b>Moray West (882 MW)</b>, <b>Dorenell (177 MW)</b> and the 1,200 MW Caithness–Moray HVDC, with <b>Caledonia (2 GW, consented 20 Jul 2026)</b> and <b>Stromar (1 GW)</b> heading for the new Greens 400 kV nearby — a deepening pool of constrained-off renewable output either side of the new 400 kV BBNP line (2030). Even Shetland\'s <b>Viking (443 MW)</b> lands here — via the 600 MW Shetland HVDC teeing into the Caithness–Moray link at Noss Head, straight into the <b>Blackhillock converter</b> — and the Caithness fleet (~700+ MW op/UC) arrives the same way via Spittal. Competition for demand capacity is already visible: <b>271 + 312 MVA of contracted BESS demand</b> sits on Keith 1 &amp; Keith 2 GSPs.</div></details>'+
'<details class="sec" open><summary class="sh">The two sites</summary><table class="d"><tr><th>Primary</th><th>Dem. HR</th><th>RAG</th><th>Gen HR</th><th>GSP</th></tr>'+
'<tr><td><b>Keith</b> (Westerton Rd)</td><td>6.42 MVA</td><td class="g">Green</td><td class="r">0.00</td><td>Keith 2</td></tr>'+
'<tr><td><b>Huntly</b> (Depot Rd)</td><td>8.08 MVA</td><td class="g">Green</td><td class="r">0.00</td><td>Keith 2</td></tr></table>'+
'<div class="note" style="border:0;margin:4px 0 0;padding:0">Keith\'s primary shares its fence-line with the <b>Keith 1 &amp; 2 GSPs (132/33 kV)</b> — a bespoke 33 kV or 132 kV demand connection beyond the 6.42 MVA is physically adjacent. Huntly is 33 kV-fed from Keith 2 GSP; its E/SE surroundings are Bogie floodplain (SEPA extent) — the W/SW plots are the dry side. Savills SSEN figures verified against the Headroom Dashboard Mar 2026 (resource 52e9a305).</div></details>'+

/* ---- brand chrome: collapse / restore the briefing panel ---------------- */
(function(){
  var panel=document.getElementById('panel'),
      pill=document.getElementById('panel-pill'),
      shut=document.getElementById('panel-toggle');
  if(!panel||!pill||!shut)return;
  function set(open){
    panel.classList.toggle('hidden',!open);
    pill.classList.toggle('show',!open);
    shut.setAttribute('aria-expanded',open?'true':'false');
    pill.setAttribute('aria-expanded',open?'true':'false');
  }
  shut.addEventListener('click',function(){set(false);});
  pill.addEventListener('click',function(){set(true);});
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&!panel.classList.contains('hidden'))set(false);
  });
})();
</script>
