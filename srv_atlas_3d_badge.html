<!-- ======================================================================
  SRV Atlas · 3D sim gateway
  Appended to srv_atlas.html at serve time by app_srv_atlas.py. Adds the
  pulsing BLOX badge on the yard, a persistent call-to-action, a CTA row in
  the three sim-relevant asset popups, and a full-screen overlay that loads
  the SRV 3D Sim through the app's own ?view=3d route — so the atlas carries
  none of the sim's weight and the sim boots only when summoned.
======================================================================= -->
<style>
  :root{
    --b3d-brand:#12475e; --b3d-accent:#1f5f7f; --b3d-accent-l:#3a89ae;
    --b3d-teal:#0f9d77; --b3d-ink:#0d1b23; --b3d-line:#dfe8ed;
    --b3d-font:"Inter","Inter var",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  }

  /* ---- the badge on the map ---- */
  .b3d-badge{pointer-events:auto;cursor:pointer}
  .b3d-badge .ring{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;
    border-radius:50%;background:rgba(31,95,127,.32);animation:b3dpulse 2.1s cubic-bezier(.2,.6,.35,1) infinite}
  .b3d-badge .ring2{animation-delay:1.05s}
  .b3d-badge .chip{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:44px;height:44px;border-radius:50%;border:2.5px solid #fff;background:#fff;
    box-shadow:0 2px 12px rgba(9,26,35,.5);transition:transform .18s cubic-bezier(.2,.8,.3,1)}
  .b3d-badge:hover .chip{transform:translate(-50%,-50%) scale(1.12)}
  .b3d-badge .cta{
    position:absolute;right:34px;top:50%;transform:translateY(-50%);
    display:flex;align-items:center;gap:7px;white-space:nowrap;
    background:linear-gradient(135deg,var(--b3d-brand),var(--b3d-accent) 85%);
    color:#fff;font:700 12px/1 var(--b3d-font);letter-spacing:.015em;
    padding:9px 20px 9px 14px;border-radius:999px;
    box-shadow:0 3px 16px rgba(9,26,35,.45);
    overflow:hidden;transition:transform .18s cubic-bezier(.2,.8,.3,1),box-shadow .18s;
  }
  .b3d-badge:hover .cta{transform:translateY(-50%) translateX(-2px);box-shadow:0 5px 22px rgba(9,26,35,.55)}
  .b3d-badge .cta::after{content:"";position:absolute;inset:0;
    background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.28) 48%,transparent 62%);
    transform:translateX(-110%);animation:b3dsheen 4.6s ease-in-out infinite}
  .b3d-badge .cta i{font-style:normal;font-size:10px;transition:transform .18s}
  .b3d-badge:hover .cta i{transform:translateX(3px)}
  .b3d-badge .cta .s{display:none}
  @keyframes b3dpulse{0%{transform:scale(.4);opacity:.95}72%{transform:scale(1.7);opacity:0}100%{opacity:0}}
  @keyframes b3dsheen{0%,55%{transform:translateX(-110%)}72%,100%{transform:translateX(115%)}}
  @keyframes b3dnudge{0%,100%{transform:translateY(-50%)}30%{transform:translateY(-50%) translateX(-7px)}55%{transform:translateY(-50%)}}
  .b3d-badge.nudge .cta{animation:b3dnudge 1s cubic-bezier(.3,.7,.3,1) .9s 2}
  @media (max-width:620px){
    .b3d-badge .cta .f{display:none}
    .b3d-badge .cta .s{display:inline}
    /* beside the chip the pill can run off a phone screen when the map pans —
       hang it centred underneath instead */
    .b3d-badge .cta{right:auto;left:50%;top:42px;transform:translateX(-50%);padding:8px 14px}
    .b3d-badge:hover .cta{transform:translateX(-50%) translateY(2px)}
    .b3d-badge.nudge .cta{animation:none}
  }

  /* ---- CTA row inside the asset popups ---- */
  .b3d-poprow{
    display:flex;align-items:center;gap:9px;margin-top:10px;padding:8px 10px;
    background:linear-gradient(135deg,var(--b3d-brand),var(--b3d-accent) 90%);
    border-radius:9px;cursor:pointer;transition:filter .15s;
  }
  .b3d-poprow:hover{filter:brightness(1.15)}
  .b3d-poprow img{width:26px;height:26px;border-radius:50%;border:1.5px solid #fff;flex:0 0 auto}
  .b3d-poprow b{color:#fff;font:700 11.5px/1.3 var(--b3d-font);letter-spacing:.01em;display:block}
  .b3d-poprow span{color:rgba(255,255,255,.72);font:500 10px/1.3 var(--b3d-font);display:block;margin-top:1px}

  /* ---- the overlay ---- */
  #b3d-overlay{position:fixed;inset:0;z-index:99999;display:none;align-items:stretch;justify-content:center;
    background:rgba(7,16,21,.88);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px)}
  #b3d-overlay.open{display:flex;animation:b3dovIn .22s ease}
  @keyframes b3dovIn{from{opacity:0}to{opacity:1}}
  #b3d-box{flex:1;margin:1.8vh 1.8vw;display:flex;flex-direction:column;overflow:hidden;
    background:#fff;border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.5);
    animation:b3dboxIn .3s cubic-bezier(.2,.8,.3,1)}
  @keyframes b3dboxIn{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
  #b3d-head{position:relative;flex:0 0 auto;display:flex;align-items:center;gap:13px;
    padding:11px 14px 12px 16px;background:linear-gradient(180deg,#fff,#f7fafc);
    border-bottom:1px solid var(--b3d-line);flex-wrap:wrap}
  #b3d-head::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2.5px;
    background:linear-gradient(90deg,var(--b3d-brand),var(--b3d-accent-l) 48%,var(--b3d-teal))}
  #b3d-head .chip{width:30px;height:30px;border-radius:50%;border:2px solid var(--b3d-accent);flex:0 0 auto}
  #b3d-head .t{font:700 13.5px/1.25 var(--b3d-font);color:var(--b3d-ink);letter-spacing:-.005em}
  #b3d-head .s{font:500 11px/1.35 var(--b3d-font);color:#6a7a83;margin-top:2px}
  #b3d-actions{margin-left:auto;display:flex;align-items:center;gap:7px}
  #b3d-full{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--b3d-line);
    background:#f4f8fa;color:var(--b3d-accent);cursor:pointer;text-decoration:none;
    font:650 11.3px var(--b3d-font);padding:7px 13px;border-radius:999px;transition:background .15s,border-color .15s}
  #b3d-full:hover{background:#eaf1f5;border-color:#cfdce3}
  #b3d-close{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--b3d-brand);
    color:#fff;cursor:pointer;font:700 11.8px var(--b3d-font);padding:8px 15px;border-radius:999px;transition:filter .15s}
  #b3d-close:hover{filter:brightness(1.16)}
  #b3d-stage{position:relative;flex:1;min-height:0;background:#0d1b23}
  #b3d-frame{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#0d1b23}
  #b3d-load{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;background:linear-gradient(180deg,#12222c,#0d1b23);color:#8fa5b1;
    font:650 11.5px var(--b3d-font);letter-spacing:.09em;text-transform:uppercase;transition:opacity .5s}
  #b3d-load.done{opacity:0;pointer-events:none}
  #b3d-load img{width:52px;height:52px;border-radius:50%;border:2.5px solid rgba(255,255,255,.9);
    animation:b3dfloat 2.2s ease-in-out infinite}
  #b3d-load::after{content:"";width:150px;height:2.5px;border-radius:2px;background:rgba(255,255,255,.12);
    background-image:linear-gradient(90deg,var(--b3d-accent-l),var(--b3d-teal));background-size:40% 100%;
    background-repeat:no-repeat;animation:b3dbar 1.3s ease-in-out infinite alternate}
  @keyframes b3dfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes b3dbar{from{background-position:-60% 0}to{background-position:160% 0}}
  @media (max-width:620px){
    #b3d-box{margin:0;border-radius:0}
    #b3d-head{padding:10px 12px}
    #b3d-head .s{display:none}
    #b3d-full{display:none}
  }
</style>

<script>

  /* ------------------------------------------------ route back into the app */
  function simUrl(embed){
    var href = '';
    try { href = window.parent.location.href; } catch(e){}
    if (!href) href = document.referrer || '';
    try {
      var u = new URL(href);
      u.searchParams.set('view','3d');
      if (embed) u.searchParams.set('embed','true'); else u.searchParams.delete('embed');
      u.hash = '';
      return u.toString();
