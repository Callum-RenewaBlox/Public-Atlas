# energy.renewablox.co.uk — the client packs as a static site (build_energy_site.py).
# Netlify (the renewablox-energy project) builds it on every push to live.

[build]
  command = "python3 build_energy_site.py"
  publish = "energy_site"

[build.environment]
  PYTHON_VERSION = "3.12"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
